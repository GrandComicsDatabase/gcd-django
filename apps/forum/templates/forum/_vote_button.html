<form method="post" action="{% url 'forum:post-vote' post.pk %}" hx-post="{% url 'forum:post-vote' post.pk %}" hx-swap="outerHTML" class="inline">
  {% csrf_token %}
  <button id="vote-{{ post.pk }}" type="submit" class="btn-blue-editing inline-block m-0 {% if post.user_has_voted %}bg-blue-100{% endif %}" aria-pressed="{% if post.user_has_voted %}true{% else %}false{% endif %}" title="Helpful">▲ {{ post.vote_count }}<span class="sr-only"> found this helpful</span></button>
</form>
