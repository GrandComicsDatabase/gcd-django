{% if form.errors %}
<p>
Your username and password didn't match. Please try again.
</p>
{% endif %}

<form method="post" action="{% url "login" %}">
{% csrf_token %}
<table>
<tr>
    <td>{{ form.username.label_tag }}</td>
    <td>{{ form.username }}</td>
</tr>
<tr>
    <td>{{ form.password.label_tag }}</td>
    <td>{{ form.password }}</td>
</tr>
</table>

<btn class="btn btn-blue font-bold py-1 px-4 rounded bg-blue-500 text-white hover:bg-blue-700 [:where(&)_a]:text-white [:where(&)_a:where(:visited)]:text-white [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline"><input type="submit" value="Log In" /></btn>
<input type="hidden" name="next" value="{{ next }}" />
</form>
