{% if choice.kind == 'issue' or not can_copy_multiple %}
  <form action="{% url 'select_object' select_key=select_key %}" method="POST" class="inline">
    {% csrf_token %}
    <input type="hidden" name="object_choice" value="{{ radio.data.value }}">
    <button class="{% if radio.data.value in cache_form.disabled_choices %}btn-blue-disabled font-normal bg-stone-100 text-gray-500 block max-sm:m-1 me-1 sm:mx-1 text-sm text-center rounded{% else %}btn-blue-editing font-normal block me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [&_a]:text-center{% endif %} inline py-1 px-2"
      type="submit" name="select_object"
      {% if radio.data.value in cache_form.disabled_choices %}disabled aria-describedby="{{ choice.help_id }}" title="{{ disabled_choice_title }}"{% endif %}>{% if can_copy_multiple %}Copy{% else %}Select{% endif %}</button>
  </form>
{% endif %}
<span class="inline break-words select-text">{{ radio.choice_label }}</span>
{% if radio.data.value in cache_form.disabled_choices %}
  <small id="{{ choice.help_id }}"><em>({{ disabled_choice_help }})</em></small>
{% endif %}
