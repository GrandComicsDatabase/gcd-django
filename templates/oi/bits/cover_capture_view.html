{% load static %}
{% load compress %}
{% if BETA %}
{# The camera's full-screen view, opened by the button of cover_capture_button.html. Icons: Heroicons v2 (https://heroicons.com), Copyright (c) Tailwind Labs, Inc., MIT License #}
<dialog id="capture_view" class="m-0 h-full max-h-full w-full max-w-full bg-black p-0 outline-none" tabindex="-1" aria-label="Camera" data-worker="{% static 'js/oi/cover_capture_worker.js' %}">
  <div class="relative h-full w-full overflow-hidden">
    <video id="capture_video" class="block h-full w-full object-contain" autoplay muted playsinline data-mirrored="-scale-x-100"></video>
    <canvas id="capture_overlay" class="pointer-events-none absolute inset-0 h-full w-full" data-mirrored="-scale-x-100"></canvas>
    <div id="capture_flash" class="pointer-events-none absolute inset-0 bg-white opacity-0 transition-opacity duration-150" data-flashing="opacity-80"></div>
    <p id="capture_status" class="pointer-events-none absolute inset-x-3 top-3 mx-auto max-w-xl rounded-lg bg-white/90 px-4 py-2 text-center font-medium text-gray-900 shadow empty:hidden" aria-live="polite"></p>
    <button type="button" id="capture_last" class="absolute bottom-4 left-4 hidden rounded-md border-2 border-white bg-white shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" data-shown="block" title="Close the camera and see the photo in the form" aria-label="Close the camera and see the photo in the form"><img id="capture_last_image" class="h-16 w-auto max-w-[6rem] object-contain" alt=""></button>
    <button type="button" id="capture_shoot" class="absolute bottom-4 left-1/2 flex h-16 w-16 -translate-x-1/2 items-center justify-center rounded-full border-4 border-white bg-blue-600 text-white shadow-lg transition hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-300 disabled:bg-gray-400 disabled:opacity-70" data-armed="motion-safe:animate-pulse ring-4 ring-blue-300" title="Take photo (Space)" aria-label="Take photo" disabled>
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z"/></svg>
    </button>
    <div class="absolute bottom-4 right-4 flex gap-2">
      <button type="button" id="capture_switch" class="hidden h-11 w-11 items-center justify-center rounded-full bg-white/90 text-gray-900 shadow-lg hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 disabled:opacity-50" data-shown="flex" title="Switch camera" aria-label="Switch camera"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3"/></svg></button>
      <button type="button" id="capture_cancel" class="flex h-11 w-11 items-center justify-center rounded-full bg-white/90 text-gray-900 shadow-lg hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" title="Close the camera" aria-label="Close the camera"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg></button>
    </div>
  </div>
</dialog>
{% compress js %}
<script type='text/javascript' src="{% static 'js/oi/cover_capture.js' %}"></script>
{% endcompress %}
{% endif %}
