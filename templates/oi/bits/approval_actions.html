<form action="{% url "process" id=changeset.id %}" method="POST">
  {% csrf_token %}
  <button>
    <input class="w-full min-w-24 btn-blue-editing font-normal block me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="release" value="Unassign">
  </button>
  <input type="hidden" name="comments" class="comments" />
</form>
