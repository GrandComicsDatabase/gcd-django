<form action="{% url "process" id=changeset.id %}"
      method="POST">
  {% csrf_token %}
  <button>
    <input class="sm:min-w-44 btn-queue-action font-normal block my-1 bg-stone-200 text-black text-sm text-center py-1 px-1 sm:px-2 sm:w-full w-24 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="discard" value="Discard">
  </button>
{% if changeset.state == states.PENDING %}
  {% if changeset.editable and section.object_type != "cover" %}
  <button class="sm:min-w-44 btn-queue-action font-normal block my-1 bg-stone-200 text-black text-sm text-center py-1 px-1 sm:px-2 sm:w-full w-24 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="retract">Retract And Edit Further</button>
  {% endif %}
{% endif %}
  <input type="hidden" name="comments" class="comments" />
</form>
