{% extends "oi/base_view.html" %}

{% load static %}

{% block title %}
Confirm deletion of {{ object }}
{% endblock %}

{% block view_body %}
<h2>Are you sure you want to delete {{ object }}?</h2>

<form id="comments" action="{% url "delete_revision" model_name=model_name id=id %}" method="POST">
  {% csrf_token %}
  <div {% if no_comment %}class="error_message_text"{% endif %}>
    <label for="comments">Please explain the reason for deletion (required):</label>
    <br>
    <textarea name="comments" class="w-full lg:w-4/5" rows="5"></textarea>
  </div>
  <button><input class="btn-blue-editing font-normal block me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="delete" value="Confirm Deletion"></button>
  <button><input class="btn-blue-editing font-normal block me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="cancel" value="Cancel"></button>
</form>
{% endblock %}
