{% extends "oi/base_view.html" %}
{% load static %}

{% block title %}
Confirm discard of {{ changeset }}
{% endblock %}

{% block view_body %}
<h2>Are you sure you want to discard the change for {{ changeset }}?</h2>

<div class="edit">
  <form action="{{ object_url }}" method="POST">
    {% csrf_token %}
    <button class="btn-blue-editing inline font-normal me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="discard">Confirm</button>
    <button class="btn-blue-editing inline font-normal me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="cancel">Cancel</button>
  </form>
</div>
{% endblock %}
