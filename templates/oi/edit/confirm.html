{% extends "oi/base_view.html" %}
{% load static %}

{% block title %}
GCD :: Confirm {{ type }}
{% endblock %}

{% block view_body %}

<h2>{{ header_text }}</h2>
<form method="POST" action="{{ url }}">
{% csrf_token %}
  <input type="hidden" name="comments">
  <button><input class="btn-blue-editing font-normal block me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" value="Confirm {{ confirm_button }}"></input></button>
  <button><input class="btn-blue-editing font-normal block me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center" type="submit" name="cancel" value="{{ cancel_button }}"></input></button>
</form>
{% endblock %}
