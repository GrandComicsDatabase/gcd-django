{% extends "oi/base_view.html" %}

{% load static %}
{% block title %}
GCD :: Confirm Two Issue Edits
{% endblock %}

{% block view_body %}

<h2>Do you want to edit {{ issue_one.full_name }} together with {{ issue_two.full_name }} ?</h2>
<form method="POST" action="{% url "reserve_two_issues" issue_one_id=issue_one.id issue_two_id=issue_two.id %}">
{% csrf_token %}
<btn class="btn-blue-editing inline font-normal me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center"><input type="submit" value="Confirm edit of both issues."></input></btn>
<btn class="btn-blue-editing inline font-normal me-1 mt-1 mb-1 max-sm:m-1 sm:mx-1 bg-stone-200 text-black text-sm text-center py-1 px-2 rounded cursor-pointer hover:no-underline hover:bg-stone-400 [:where(&)_a]:text-black [:where(&)_a]:block [:where(&)_a:where(:visited)]:text-black [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline [:where(&)_a]:text-center"><input type="submit" name="cancel" value="Return to {{ issue_one }}."></input></btn>
</form>
<br>
{% endblock %}
