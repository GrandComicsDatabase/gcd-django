{% extends "gcd/tw_base_view.html" %}

{% block view_body %}
<p>
To send an e-mail to us, please enter your name, email, and message and press submit.
</p>
<form class="mb-2" action="/contact/" method="post">
{% csrf_token %}
<table>
{{ form.as_table }}
</table>
<button class="btn btn-blue font-bold py-1 px-4 rounded bg-blue-500 text-white hover:bg-blue-700 [:where(&)_a]:text-white [:where(&)_a:where(:visited)]:text-white [@media(hover:hover)]:[:where(&)_a:where(:hover)]:no-underline"> <input type="submit" value="Submit"></button>
</form>
{% endblock %}
