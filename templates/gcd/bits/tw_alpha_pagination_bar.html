<div class="flex justify-end mt-1 h-8 items-center">
  <div class="flex">
    <ul class="max-md:hidden flex items-center h-8">
{% for a_page in alpha_paginator.page_range %}
    <li>
  {% if a_page %}
    {% if a_page == alpha_page %}
        <span class="flex items-center justify-center h-8 navigation-bar-box-link text-black visited:text-black px-2 hover:bg-blue-300 hover:no-underline border border-gray-400 bg-blue-300 {% if forloop.first %}rounded-s-lg{% endif %}{% if forloop.last %}rounded-e-lg{% endif %}">{{ a_page }}</span>
        {% else %}
        <a class="flex items-center justify-center h-8 navigation-bar-box-link text-black visited:text-black px-2 hover:no-underline border border-gray-400 {% if forloop.first and forloop.last %}hover:bg-blue-100{% else %}hover:bg-blue-300{% endif %} {% if forloop.first %}rounded-s-lg{% endif %}{% if forloop.last %}rounded-e-lg{% endif %}" href="?page=a_{{ a_page.number }}">{{ a_page }}</a>
    {% endif %}
  {% else %}
        <a>...</a>
  {% endif %}
    </li>
{% endfor %}
    </ul>
  </div>
</div>
