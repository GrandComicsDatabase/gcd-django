{% load static %}
<script src="https://unpkg.com/hyperscript.org"></script>
<link rel="stylesheet" type="text/css"
        href="{% static "css/gcd/default/modal.css" %}"/>
<div id="modal" _="on closeModal add .closing then wait for animationend then remove me">
	<div class="modal-underlay" _="on click trigger closeModal"></div>
	<div class="modal-content">
		<p>The source of the <b>{{ credit.credit_type }}</b> credit for <b>{{ credit.creator.name }}</b> is:
		<br>
		{{ credit.sourced_by }}
		</p>
		<div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
			<button class="btn btn-blue-editing" _="on click trigger closeModal">Close</button>
			<a class="hover:no-underline" href="{{ issue_url }}"><button class="btn btn-blue-editing">Show All Sources</button></a>
		</div>
	</div>
</div>
