{% extends "gcd/tw_base_view.html" %}

{% block view_body %}
  <main class="w-full px-2 py-2 sm:px-4">
    {% block keyword_navigation %}{% endblock %}
    <header class="flex flex-wrap items-center justify-between gap-4 mb-2">
      <div class="flex flex-wrap items-center gap-4">
        <h1>{% block keyword_heading %}{% endblock %}</h1>
        <span class="rounded-full border bg-gray-200 px-2 py-1 text-sm text-gray-700">Read-only</span>
      </div>
      {% block keyword_actions %}{% endblock %}
    </header>
    {% block keyword_body %}{% endblock %}
  </main>
{% endblock %}
