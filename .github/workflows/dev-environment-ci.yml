name: Development environment compatibility

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python 3.13 and MySQL 8.0+
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: gcd_dev_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DJANGO_SETTINGS_MODULE: settings_dev
      MYSQL_DATABASE: gcd_dev_ci
      MYSQL_HOST: 127.0.0.1
      MYSQL_PASSWORD: native_ci_password
      MYSQL_PORT: 3306
      MYSQL_USER: native_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            default-libmysqlclient-dev \
            git \
            libicu-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<81"
          python -m pip install -r requirements.txt

      - name: Provision the native CI database user
        env:
          MYSQL_SERVICE: ${{ job.services.mysql.id }}
        run: |
          # Root is used only inside this disposable service for provisioning.
          # Escape underscores because database GRANT names are MySQL patterns.
          docker exec -i "$MYSQL_SERVICE" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -uroot' <<'SQL'
          CREATE USER 'native_ci'@'%' IDENTIFIED BY 'native_ci_password';
          GRANT ALL ON `gcd\_dev\_ci`.* TO 'native_ci'@'%';
          GRANT ALL ON `test\_gcd\_dev\_ci`.* TO 'native_ci'@'%';
          SQL

      - name: Smoke-test native setup on the empty database
        run: python .github/scripts/smoke_native_setup.py

      - name: Verify native runtime and seeded data
        run: |
          ./bin/dev --runtime native doctor
          ./bin/dev --runtime native manage shell -c "
          from django.contrib.auth import authenticate
          from apps.gcd.models import Series
          assert authenticate(username='editor', password='editme') is not None, 'Fixture login failed'
          Series.objects.get(name='[GCD DEV] Adventures')
          "

      - name: Run application smoke tests
        run: |
          ./bin/dev --runtime native test -q \
            apps/gcd/tests/test_dev_environment_core.py \
            apps/gcd/tests/test_dev_environment.py \
            apps/gcd/tests/test_devcontainer.py \
            apps/gcd/tests/test_devcontainer_database.py \
            apps/gcd/tests/test_devcontainer_ci.py \
            apps/gcd/tests/test_development_docs.py \
            apps/gcd/tests/test_native_reset_safety.py \
            apps/gcd/tests/test_native_reset_reference_data.py \
            apps/gcd/tests/test_markdown_startup.py \
            apps/gcd/tests/test_notes_rendering.py \
            apps/gcd/tests/test_health.py \
            apps/gcd/tests/test_front_page_search_performance.py \
            apps/gcd/tests/test_search_indexes.py \
            apps/gcd/tests/test_seed_development_data.py \
            apps/gcd/tests/test_publisher.py \
            apps/gcd/tests/test_series.py \
            apps/gcd/tests/test_issue.py \
            apps/gcd/tests/test_story.py \
            apps/gcd/tests/test_reprint.py \
            apps/stats/tests/test_countstats.py

      - name: Run API v2 tests when available
        run: |
          if [ -d apps/api_v2/tests ]; then
            ./bin/dev --runtime native test apps/api_v2/tests/ -q
          fi

  devcontainer-smoke:
    name: Dev Container CLI lifecycle and Linux ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Use the tested plugin without replacing the runner's system Compose.
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/gcd-devcontainer-docker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node for the pinned Dev Container CLI
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install the tested Compose plugin
        env:
          COMPOSE_VERSION: v5.7.1
          COMPOSE_SHA256: af426722a8af5de812fcee30cc1c39f0639f5f723cbadefb25e5d4db054064cf
        run: |
          # Older Compose can omit access to Dev Containers' generated Dockerfile.
          install -d "$DOCKER_CONFIG/cli-plugins"
          curl --fail --location --silent --show-error \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64" \
            --output "$DOCKER_CONFIG/cli-plugins/docker-compose"
          actual_sha256="$(sha256sum "$DOCKER_CONFIG/cli-plugins/docker-compose" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$COMPOSE_SHA256"
          chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
          test "$(docker compose version --short)" = "${COMPOSE_VERSION#v}"
          docker buildx version

      - name: Rehearse an isolated Dev Container clone
        run: python3 .github/scripts/smoke_devcontainer.py

  compose-smoke:
    name: Docker Compose core setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the core stack
        run: docker compose up --build --wait

      - name: Verify the running environment
        run: |
          ./bin/dev doctor
          buffer_pool_size="$(
            docker compose exec -T db sh -c \
              'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot -e "SELECT @@innodb_buffer_pool_size"'
          )"
          test "$buffer_pool_size" = "1073741824"
          curl --fail --silent --show-error http://127.0.0.1:8000/ -o /dev/null

      - name: Stop the core stack
        if: always()
        run: docker compose down --volumes

  search-smoke:
    name: Docker Compose optional search
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create the deterministic development database
        run: ./bin/dev setup --replace --yes

      - name: Start search and build the sample index
        run: ./bin/dev search-rebuild --batch-size 100

      - name: Verify queries and queued updates
        run: >-
          docker compose exec -T web python manage.py
          verify_development_search

      - name: Stop the search stack
        if: always()
        run: docker compose --profile search down --volumes
