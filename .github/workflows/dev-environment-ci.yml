name: Development environment compatibility

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python 3.14 and MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: gcd_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DJANGO_SETTINGS_MODULE: settings_dev
      EXPECTED_MYSQL_VERSION: 8.4.10
      MYSQL_DATABASE: gcd_ci
      MYSQL_HOST: 127.0.0.1
      MYSQL_PASSWORD: test
      MYSQL_PORT: 3306
      MYSQL_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            default-libmysqlclient-dev \
            libicu-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<81"
          python -m pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Verify runtime contract
        run: python scripts/check_dev_environment.py

      - name: Run application smoke tests
        run: |
          python -m pytest -q \
            apps/gcd/tests/test_publisher.py \
            apps/gcd/tests/test_series.py \
            apps/gcd/tests/test_issue.py \
            apps/gcd/tests/test_story.py \
            apps/gcd/tests/test_reprint.py \
            apps/stats/tests/test_countstats.py

      - name: Run API v2 tests when available
        run: |
          if [ -d apps/api_v2/tests ]; then
            python -m pytest apps/api_v2/tests/ -q
          fi
